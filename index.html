<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앵커패닉 1.5주년 · 15달러 스쿼드 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12121a;
  --panel:#1c1c26;
  --panel2:#23232f;
  --line:#33333f;
  --text:#eceaf2;
  --dim:#8d8b9a;
  --accent:#6ee7ff;
  --danger:#ff6b6b;
  --t5:#ff7f7f;
  --t4:#ffbf7f;
  --t3:#ffdf7f;
  --t2:#bfff7f;
  --t1:#7fbfff;
  --cell:74px;
  --font:'Noto Sans KR', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px;}

/* header */
header{text-align:center;padding:24px 0 16px;}
header h1{font-size:26px;font-weight:900;margin:0 0 6px;letter-spacing:-.5px;}
header p{margin:0;color:var(--dim);font-size:14px;}

/* squad */
.squad-wrap{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:12px 0 14px;
  border-bottom:1px solid var(--line);
  margin-bottom:22px;
}
.budget{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-bottom:12px;flex-wrap:wrap;
}
.budget .big{font-size:30px;font-weight:900;letter-spacing:-1px;}
.budget .big.over{color:var(--danger);}
.budget .sub{color:var(--dim);font-size:13px;}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.slot{
  width:var(--cell);height:calc(var(--cell) + 22px);
  border:2px dashed var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panel);cursor:default;position:relative;overflow:hidden;
  flex:0 0 auto;
}
.slot.filled{border-style:solid;cursor:pointer;}
.slot .ph{color:var(--dim);font-size:22px;font-weight:300;}
.slot .nm{
  font-size:10px;font-weight:700;text-align:center;line-height:1.1;
  padding:2px 3px;width:100%;word-break:keep-all;
  height:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.slot .pr{
  position:absolute;top:2px;right:3px;font-size:10px;font-weight:900;
  background:rgba(0,0,0,.65);border-radius:4px;padding:1px 4px;
}
.slot .thumb{width:100%;height:var(--cell);object-fit:cover;display:block;background:var(--panel2);}
.slot .fallback{
  width:100%;height:var(--cell);
  background:repeating-linear-gradient(45deg,#1e1e29,#1e1e29 6px,#23232f 6px,#23232f 12px);
}

/* controls */
.ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
button,.btn{
  font-family:var(--font);font-size:13px;font-weight:700;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;cursor:pointer;
}
button:hover{background:#2e2e3c;}
button:active{transform:translateY(1px);}
button.primary{background:var(--accent);color:#0c1014;border-color:var(--accent);}
button:disabled{opacity:.4;cursor:not-allowed;}
#uid{
  font-family:var(--font);font-size:13px;
  background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;width:190px;text-align:center;
}
#uid::placeholder{color:var(--dim);}
#uid.warn{border-color:var(--danger);animation:shake .35s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
}

/* tiers */
.tier{display:flex;border:1px solid var(--line);border-top:none;background:var(--panel);}
.tier:first-of-type{border-top:1px solid var(--line);border-radius:10px 10px 0 0;overflow:hidden;}
.tier:last-of-type{border-radius:0 0 10px 10px;overflow:hidden;}
.tier-label{
  flex:0 0 66px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#18181f;
}
.t5 .tier-label{background:var(--t5);}
.t4 .tier-label{background:var(--t4);}
.t3 .tier-label{background:var(--t3);}
.t2 .tier-label{background:var(--t2);}
.t1 .tier-label{background:var(--t1);}
.tier-body{
  flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:6px;
  background:#0d0d14;align-content:flex-start;
}
.card{
  width:var(--cell);border-radius:8px;overflow:hidden;
  background:var(--panel2);cursor:pointer;border:2px solid transparent;
  position:relative;
}
.card:hover{border-color:var(--accent);}
.card.picked{opacity:.28;pointer-events:none;}
.card.unaffordable{opacity:.35;}
.card .thumb{width:100%;height:var(--cell);object-fit:cover;display:block;}
.card .fallback{
  width:100%;height:var(--cell);
  background:repeating-linear-gradient(45deg,#1e1e29,#1e1e29 6px,#23232f 6px,#23232f 12px);
}
.card .nm{
  font-size:10px;font-weight:700;text-align:center;line-height:1.1;
  padding:3px 2px;word-break:keep-all;
  height:30px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.card .badge{
  position:absolute;top:2px;left:3px;font-size:9px;font-weight:900;
  background:rgba(0,0,0,.7);border-radius:4px;padding:1px 4px;color:#ffe08a;
}

/* result */
.result{
  margin-top:26px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:16px;
}
.result h2{font-size:15px;margin:0 0 10px;font-weight:700;}
#out{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.7;white-space:pre-wrap;
  background:#0d0d14;border:1px solid var(--line);border-radius:8px;
  padding:12px;color:var(--text);margin:0;
}
.note{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.6;}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;
  overflow:auto;
}
.modal.show{display:flex;}
.modal-inner{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px;max-width:620px;width:100%;text-align:center;
}
.modal-inner h3{margin:0 0 4px;font-size:16px;font-weight:700;}
.modal-inner .guide{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.6;}
.modal-inner img{
  width:100%;height:auto;border-radius:8px;display:block;
  border:1px solid var(--line);
}
.modal-ctrls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--accent);color:#0c1014;font-weight:700;font-size:13px;
  padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:99;
}
.toast.show{opacity:1;}

@media (max-width:640px){
  :root{--cell:58px;}
  .tier-label{flex:0 0 44px;font-size:18px;}
  header h1{font-size:20px;}
  .budget .big{font-size:25px;}
  #uid{width:150px;}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>15달러로 당신의 스쿼드를 짜봐라</h1>
  <p>예산 15달러 · 5명 편성 · 기준은 자유</p>
</header>

<div class="squad-wrap">
  <div class="budget">
    <div><span class="big" id="spent">0</span><span class="sub"> / 15 달러</span></div>
    <div class="sub">남은 예산 <b id="left">15</b> · 남은 자리 <b id="empty">5</b></div>
  </div>
  <div class="slots" id="slots"></div>
  <div class="ctrls">
    <input id="uid" placeholder="UID 입력 (필수)" maxlength="20">
    <button onclick="reset()">초기화</button>
    <button onclick="copyText()">텍스트 복사</button>
    <button class="primary" onclick="saveImage()">이미지 만들기</button>
  </div>
</div>

<div id="tiers"></div>

<div class="result">
  <h2>응모 양식</h2>
  <pre id="out"></pre>
  <p class="note">
    <b>이미지만 올리지 말고 위 텍스트도 함께 붙여넣어 주세요.</b>
    텍스트가 없으면 응모 확인이 늦어질 수 있습니다.
  </p>
</div>

</div>
<div class="modal" id="modal">
  <div class="modal-inner">
    <h3>스쿼드 이미지가 만들어졌습니다</h3>
    <p class="guide">
      휴대폰은 <b>이미지를 길게 눌러</b> 저장하세요.<br>
      PC는 <b>우클릭 → 이미지를 다른 이름으로 저장</b>을 쓰거나 아래 버튼을 누르세요.
    </p>
    <img id="shot" alt="내 스쿼드">
    <div class="modal-ctrls">
      <button onclick="downloadShot()">다운로드</button>
      <button onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BUDGET = 15, SIZE = 5;

const DATA = [
  { price:5, list:["설희","어비스 알리시아","링링","홍엽","제피린","화이트 로즈","명화","벨그스타"] },
  { price:4, list:["아이리스","윈드리스","카프니르","나엘라","카디악","아르고","퀘이사","올리비아","티아","아이스 서펀트","헤메크","스트루나","유카리","이베트","플레니룬","칼란리사","오스카린","티파니","프리클리 로즈","여명의 기사·루미스"] },
  { price:3, list:["우리엘","그래닛 썬더","릴리라","디 오션","앨리스","에코","메를로","루미스","린","마르셀린","오로라","옌","클리프","그르나슈","레이븐","다발린","알리시아","센토레아","샤이니","스트리크닌"] },
  { price:2, list:["레코르사","다이아몬드","블레이즈 윙","마이스터","네온","카탈파","엔야","반디","안텔롭","디오네","머스탱","프리즘","케미아","라이온 블레이드","스노우 폭스"] },
  { price:1, list:["코라즈","A.R.C","펠리시아","켈","트리거"] }
];

const LIMITED = new Set(DATA[0].list);
let squad = [];

function iconPath(n){ return "assets/icons/" + n + ".png"; }

function thumbHTML(name){
  const safe = name.replace(/"/g,'&quot;');
  return '<img class="thumb" src="'+iconPath(name)+'" alt="'+safe+'" '+
         'onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>'+safe+'</div>\'">';
}

function buildTiers(){
  const root = document.getElementById('tiers');
  root.innerHTML = DATA.map(t =>
    '<div class="tier t'+t.price+'">'+
      '<div class="tier-label">$'+t.price+'</div>'+
      '<div class="tier-body">'+
        t.list.map(n =>
          '<div class="card" data-n="'+n+'" data-p="'+t.price+'" onclick="pick(\''+n.replace(/'/g,"\\'")+'\','+t.price+')">'+
            (LIMITED.has(n) ? '<div class="badge">한정</div>' : '')+
            thumbHTML(n)+
            '<div class="nm">'+n+'</div>'+
          '</div>').join('')+
      '</div>'+
    '</div>'
  ).join('');
}

function spent(){ return squad.reduce((a,c)=>a+c.p, 0); }

function pick(n,p){
  if(squad.length >= SIZE){ toast('자리가 5개뿐입니다'); return; }
  if(spent() + p > BUDGET){ toast('예산이 부족합니다'); return; }
  squad.push({n:n, p:p});
  render();
}

function drop(i){ squad.splice(i,1); render(); }
function reset(){ squad = []; render(); }

function render(){
  const s = spent(), left = BUDGET - s;
  document.getElementById('spent').textContent = s;
  document.getElementById('spent').classList.toggle('over', s > BUDGET);
  document.getElementById('left').textContent = left;
  document.getElementById('empty').textContent = SIZE - squad.length;

  const slots = document.getElementById('slots');
  let h = '';
  for(let i=0;i<SIZE;i++){
    if(squad[i]){
      h += '<div class="slot filled" onclick="drop('+i+')" title="클릭하면 제외됩니다">'+
             '<div class="pr">$'+squad[i].p+'</div>'+
             thumbHTML(squad[i].n)+
             '<div class="nm">'+squad[i].n+'</div>'+
           '</div>';
    } else {
      h += '<div class="slot"><div class="ph">+</div></div>';
    }
  }
  slots.innerHTML = h;

  const names = new Set(squad.map(x=>x.n));
  document.querySelectorAll('.card').forEach(c=>{
    const n = c.dataset.n, p = +c.dataset.p;
    c.classList.toggle('picked', names.has(n));
    c.classList.toggle('unaffordable', !names.has(n) && (p > left || squad.length >= SIZE));
  });

  document.getElementById('out').textContent = text();
}

function text(){
  const uid = document.getElementById('uid').value.trim();
  const lines = [];
  lines.push('UID : ' + (uid || '(입력해 주세요)'));
  lines.push('스쿼드 : ' + (squad.length
      ? squad.map(x=>x.n+' $'+x.p).join(' / ')
      : '(아직 없음)'));
  lines.push('합계 : ' + spent() + ' / ' + BUDGET);
  lines.push('한 줄 : ');
  return lines.join('\n');
}

function warnUid(){
  const el=document.getElementById('uid');
  el.classList.add('warn'); el.focus();
  setTimeout(()=>el.classList.remove('warn'),1200);
  toast('UID를 먼저 입력해 주세요');
}

function copyText(){
  if(!document.getElementById('uid').value.trim()){ warnUid(); return; }
  if(squad.length===0){ toast('먼저 스쿼드를 짜주세요'); return; }
  const t = text();
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(()=>toast('복사했습니다')).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ toast('복사에 실패했습니다'); }
  document.body.removeChild(ta);
}

function saveImage(){
  if(squad.length === 0){ toast('먼저 스쿼드를 짜주세요'); return; }

  const uid=document.getElementById('uid').value.trim();
  if(!uid){ warnUid(); return; }

  const W=880, CELL=150, PAD=28;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=470; const g=cv.getContext('2d');
  g.fillStyle='#12121a'; g.fillRect(0,0,W,cv.height);

  g.fillStyle='#eceaf2'; g.textAlign='center';
  g.font='900 30px "Noto Sans KR", sans-serif';
  g.fillText('MY SQUAD', W/2, 52);
  g.font='500 14px "Noto Sans KR", sans-serif'; g.fillStyle='#8d8b9a';
  g.fillText('앵커패닉 1.5주년 · 15달러 스쿼드 챌린지', W/2, 76);

  // UID 배지
  g.font='900 22px "Noto Sans KR", sans-serif';
  const ut='UID  '+uid, uw=g.measureText(ut).width+36;
  g.fillStyle='#6ee7ff';
  const bx=(W-uw)/2;
  if(g.roundRect){ g.beginPath(); g.roundRect(bx,92,uw,38,19); g.fill(); }
  else g.fillRect(bx,92,uw,38);
  g.fillStyle='#0c1014'; g.fillText(ut, W/2, 119);

  const total=squad.length, gap=12;
  const cw=Math.min(CELL,(W-PAD*2-gap*(total-1))/total);
  const startX=(W-(cw*total+gap*(total-1)))/2, y=150;
  let done=0;
  const finish=()=>{
    g.fillStyle='#6ee7ff'; g.textAlign='center';
    g.font='900 26px "Noto Sans KR", sans-serif';
    g.fillText('$'+spent()+' / $15', W/2, y+cw+96);
    let url;
    try{ url = cv.toDataURL('image/png'); }
    catch(e){
      toast('이미지를 만들 수 없습니다. 화면을 캡처해 주세요');
      return;
    }
    document.getElementById('shot').src = url;
    document.getElementById('modal').classList.add('show');
  };
  squad.forEach((c,i)=>{
    const x=startX+i*(cw+gap);
    g.fillStyle='#23232f'; g.fillRect(x,y,cw,cw);
    g.fillStyle='#eceaf2'; g.textAlign='center';
    g.font='900 18px "Noto Sans KR", sans-serif';
    g.fillText('$'+c.p, x+cw/2, y+cw+26);
    g.font='700 13px "Noto Sans KR", sans-serif';
    wrap(g, c.n, x+cw/2, y+cw+48, cw, 16);
    const img=new Image();
    img.onload=()=>{ g.drawImage(img,x,y,cw,cw); if(++done===total) finish(); };
    img.onerror=()=>{ if(++done===total) finish(); };
    img.src=iconPath(c.n);
  });
}
function wrap(g,t,x,y,maxW,lh){
  const ch=t.split(''); let line='', ln=0;
  for(const c of ch){
    if(g.measureText(line+c).width > maxW && line){ g.fillText(line,x,y+ln*lh); line=c; ln++; }
    else line+=c;
  }
  g.fillText(line,x,y+ln*lh);
}

function downloadShot(){
  const url=document.getElementById('shot').src;
  if(!url) return;
  const a=document.createElement('a');
  a.download='anchor_panic_squad.png'; a.href=url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('저장되지 않으면 이미지를 길게 눌러 주세요');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.addEventListener('click', e=>{
  if(e.target.id==='modal') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

let tt;
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1600);
}

document.getElementById('uid').addEventListener('input', ()=>{
  document.getElementById('out').textContent = text();
});

buildTiers();
render();
</script>
</body>
</html>
